# Production Docker Compose Configuration
# 
# Environment Variable Handling:
# - Build-time variables (like VITE_CLERK_PUBLISHABLE_KEY) are read from .env file
#   that the deployment script creates from .env.production
# - Runtime variables are loaded from .env.production via env_file directive
# - This ensures frontend gets the correct environment variables baked into the build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from .env file that will be created by deployment script
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NODE_EXTRA_CA_CERTS=/app/certs/us-east-1-bundle.pem
    env_file:
      - .env.production
    volumes:
      - /opt/sms-app/certs:/app/certs:ro
      - /opt/sms-app/scripts:/app/scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 