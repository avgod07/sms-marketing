services:
  app:
    image: mcr.microsoft.com/vscode/devcontainers/javascript-node:20
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      # Use the Postgres service hostname inside the devcontainer
      DATABASE_URL: postgres://sms:sms@db:5432/sms
    ports:
      # Expose container port 5000 on host port 5001
      - "5001:5000"
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
volumes:
  postgres-data:
