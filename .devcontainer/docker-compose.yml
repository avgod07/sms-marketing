services:
  app:
    image: mcr.microsoft.com/vscode/devcontainers/javascript-node:20
    volumes:
      - /Users/ayushgodhani/desktop/sms
    command: sleep infinity
    ports:
      # Expose container port 5000 on host port 5001
      - "5001:5000"
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
volumes:
  postgres-data:
