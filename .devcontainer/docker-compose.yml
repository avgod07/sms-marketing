services:
  app:
    image: mcr.microsoft.com/vscode/devcontainers/javascript-node:20
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      # Use the Postgres service hostname inside the devcontainer
      DATABASE_URL: postgres://sms:sms@db:5432/sms
      # Clerk keys from your dashboard
      CLERK_PUBLISHABLE_KEY: pk_test_ZGFyaW5nLXBvc3N1bS02NS5jbGVyay5hY2NvdW50cy5kZXYk
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZGFyaW5nLXBvc3N1bS02NS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_sAWls4XZuUSXaDFZMRuV77DXFzUINt1hAhsIeLCjym
    ports:
      # Expose container port 5000 on host port 5001
      - "5001:5000"
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
volumes:
  postgres-data: